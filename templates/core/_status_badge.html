{% if status == "completed" %}
    <span class="badge text-bg-success">{{ label }}</span>
{% elif status == "failed" %}
    <span class="badge text-bg-danger">{{ label }}</span>
{% elif status == "pending" %}
    <span class="badge text-bg-secondary">{{ label }}</span>
{% else %}
    <span class="badge text-bg-primary">
        <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>{{ label }}
    </span>
{% endif %}
